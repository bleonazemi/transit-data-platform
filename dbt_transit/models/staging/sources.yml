version: 2

sources:
  - name: gtfs_raw 
    meta:
      external_location: "../data/processed/{name}.parquet"
    tables:
      - name: stops
        description: "Validated Chicago CTA stop locations and metadata."
        columns:
          - name: stop_id
            tests:
              - unique
              - not_null
      - name: routes
        description: "Transit routes (bus and rail lines)"
        columns:
          - name: route_id
            tests:
              - unique 
              - not_null
      - name: trips
        description: "Scheduled trips mapped to routes and services calenders."
        columns:
          - name: trip_id
            tests:
              - unique
              - not_null
      - name: stop_times
        description: "Scheduled arrival and departurem times per stop sequence."
        columns:
          - name: trip_id
            tests:
              - not_null
          - name: stop_id
            tests:
              - not_null 
